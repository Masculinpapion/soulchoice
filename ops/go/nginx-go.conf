    # seo-geo 21.10.2026: /go?src=&to= tıklama takibi → yerel servis (soulchoice-go.service, 127.0.0.1:4921)
    location = /go { proxy_pass http://127.0.0.1:4921; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 5s; }
